<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vixeo : vos films et séries, sur tous vos écrans.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vixeo">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>

  <title>Vixeo</title>
  <meta name="theme-color" content="#070A08">
  <link rel="manifest" href="manifest.json">
  <style>
    /* No HTML loading screen (developer's request): only the app's own (Flutter) one. The dark
       background avoids a white flash until Flutter draws. */
    html, body {
      margin: 0;
      min-height: 100%;
      background: #070A08;
    }
  </style>
</head>
<body>
  <!-- HLS on the web: hls.js (web/hls.min.js, Apache-2.0, served from our own origin) is NOT
       loaded here. The player adds it only when a stream needs it (Chrome, Firefox, Edge):
       a browser that plays HLS on its own (Safari) never downloads it.
       See lib/features/playback/engine/web/hls_js_interop.dart. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
