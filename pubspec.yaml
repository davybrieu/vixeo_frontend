name: vixeo
description: "Vixeo, media center multiplateforme."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Material widgets and their translations (Flutter 3.47 moved them out of the SDK:
  # package:flutter/material.dart is deprecated). go_router uses it too.
  material_ui: ^1.10.0
  font_awesome_flutter: ^11.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.6
  flutter_cache_manager: ^3.5.0
  url_launcher: ^6.3.3
  # The player's engines (lib/features/playback/engine): the screen and its controls are common,
  # only what plays the video depends on the platform.
  # - Android / iOS: better_native_video_player (ExoPlayer / AVPlayer).
  # - Windows: media_kit (libmpv, bundled by media_kit_libs_windows_video): HLS, MP4, MKV… with
  #   the headers the plug-ins ask for.
  # - The tests (and macOS / Linux): video_player.
  video_player: ^2.9.2
  better_native_video_player: ^1.9.1
  media_kit: ^1.2.3
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  # Windows: the player's full screen.
  window_manager: ^0.5.1
  # Plug-ins (lib/features/addons, docs/scrapers.md): the JavaScript engine that runs a scraper on
  # Android and Windows (QuickJS) and iOS (JavaScriptCore), in its own isolate.
  flutter_js: ^0.8.0
  package_info_plus: ^10.2.2
  crypto: ^3.0.8
  path_provider: ^2.1.6
  # Push notifications sent by the Vixeo server (Firebase Cloud Messaging), and those received
  # while the app is open, shown by the app (docs/notifications.md of vixeo_backend).
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.3
  # Native photo/video selection on Android, iOS and Windows.
  file_picker: ^13.4.1
  # « Continuer avec Google / Apple » (features/auth/social_sign_in.dart): the sign-in page in a
  # Chrome tab on Android (ASWebAuthenticationSession on iOS), back to the app by app.vixeo://auth.
  # Windows uses its own little server (LoopbackAuthorizer), not this package's webview.
  flutter_web_auth_2: ^6.1.0

# flutter_web_auth_2's webview for Windows and Linux (WebView2) is never used (useWebview: false
# would be needed, and Windows has its own server): its stub, from the package's repository (MIT,
# third_party/), keeps WebView2 out of the Windows build.
dependency_overrides:
  flutter_web_auth_2_desktop_webview:
    path: third_party/flutter_web_auth_2_desktop_webview_stub

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled fonts (SIL Open Font License, texts in assets/fonts/OFL-*.txt, shown in "Licences"):
  # no font is downloaded at launch.
  assets:
    - assets/fonts/OFL-Sora.txt
    - assets/fonts/OFL-Inter.txt
    # Official TMDb logo ("Primary short", themoviedb.org/about/logos-attribution), as a PNG.
    - assets/images/tmdb_short.png
    # Vixeo's icon (brand/icons/icon-rounded.svg, 192 px): the icon of the Windows notifications.
    - assets/images/app_icon.png
    # Logos of the rating sites (brand/ratings, brand/tools/rating_logos.py) and the licence of
    # the Lucide icon used for Rotten Tomatoes' audience score.
    - assets/images/ratings/
    # Logos of « Continuer avec Google / Apple » (brand/sign-in, brand/tools/sign_in_logos.py).
    - assets/images/sign_in/
    - assets/licenses/lucide-ISC.txt
    # The sandbox every plug-in scraper runs on top of (same file on every platform).
    - assets/scrapers/sandbox.js
    # crypto-js 4.2.0, lent to the scrapers that use it, as Nuvio does (docs/scrapers.md), and its licence.
    - assets/scrapers/crypto-js.min.js
    - assets/licenses/crypto-js-MIT.txt
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
