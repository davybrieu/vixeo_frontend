name: Build

# The apps: Android (APK) and Windows (installer), published as GitHub releases that the API reads
# for the in-app updates (vixeo_backend/docs/mise-a-jour.md). No web version any more.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Added to github.run_number to make the build number (see "Read app version").
  BUILD_OFFSET: 400
  API_URL: https://api.vixeo.app
  REVERB_HOST: api.vixeo.app
  REVERB_PORT: 443
  REVERB_SCHEME: https
  REVERB_APP_KEY: ${{ vars.REVERB_APP_KEY }}
  PUBLISHER_NAME: Vixeo
  SUPPORT_EMAIL: support@vixeo.app

jobs:
  # Analysis and tests first: a failing test stops the releases.
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Errors fail the build; warnings and infos are reported.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

  # Pull requests: the Android app must still compile (native player plugin, Gradle, manifest),
  # without the release key and without publishing anything. The release job below only runs
  # on main: without this one, a broken Android build would only be seen after the merge.
  build-apk-debug:
    name: Build Android APK (debug, pull requests only)
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_URL="${{ env.API_URL }}"

  build-apk-release:
    name: Build Android APK and publish GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Build number: always growing. This workflow was renamed on 20/11/2026 (build-web.yml →
          # build.yml), which restarted github.run_number at 1, while the last APK was build 367:
          # the offset keeps every new build above the old ones (Android refuses a lower one).
          echo "build=$(( ${{ github.run_number }} + BUILD_OFFSET ))" >> "$GITHUB_OUTPUT"

      - name: Restore Android release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VIXEO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret VIXEO_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vixeo-release.jks"
          test -s "$RUNNER_TEMP/vixeo-release.jks"

      - name: Build signed APK
        env:
          VIXEO_KEYSTORE_PATH: ${{ runner.temp }}/vixeo-release.jks
          VIXEO_KEYSTORE_PASSWORD: ${{ secrets.VIXEO_KEYSTORE_PASSWORD }}
          VIXEO_KEY_ALIAS: ${{ secrets.VIXEO_KEY_ALIAS }}
          VIXEO_KEY_PASSWORD: ${{ secrets.VIXEO_KEY_PASSWORD }}
          # Push notifications (docs/android-release.md): the Firebase project's Android app.
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          missing=""
          for name in FIREBASE_APP_ID FIREBASE_API_KEY FIREBASE_SENDER_ID FIREBASE_PROJECT_ID; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing secrets:$missing. This APK receives no push notification (docs/android-release.md)"
          fi
          flutter build apk --release \
            --build-number="${{ steps.app-version.outputs.build }}" \
            --dart-define=API_URL="${{ env.API_URL }}" \
            --dart-define=REVERB_HOST="${{ env.REVERB_HOST }}" \
            --dart-define=REVERB_PORT="${{ env.REVERB_PORT }}" \
            --dart-define=REVERB_SCHEME="${{ env.REVERB_SCHEME }}" \
            --dart-define=REVERB_APP_KEY="${{ env.REVERB_APP_KEY }}" \
            --dart-define=PUBLISHER_NAME="${{ env.PUBLISHER_NAME }}" \
            --dart-define=SUPPORT_EMAIL="${{ env.SUPPORT_EMAIL }}"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/vixeo-${{ steps.app-version.outputs.build }}.apk"
          sha256sum "release/vixeo-${{ steps.app-version.outputs.build }}.apk" > "release/vixeo-${{ steps.app-version.outputs.build }}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ steps.app-version.outputs.build }}
          name: Vixeo Android v${{ steps.app-version.outputs.version }} - build ${{ steps.app-version.outputs.build }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/vixeo-${{ steps.app-version.outputs.build }}.apk
            release/vixeo-${{ steps.app-version.outputs.build }}.apk.sha256

  # The Windows app (docs/windows-release.md): an Inno Setup installer, for the current user (no
  # administrator rights), published as the GitHub release windows-<build>. Same build number as
  # the APK of the same run.
  build-windows-release:
    name: Build Windows installer and publish GitHub Release
    needs: checks
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Build number: always growing. This workflow was renamed on 20/11/2026 (build-web.yml →
          # build.yml), which restarted github.run_number at 1, while the last APK was build 367:
          # the offset keeps every new build above the old ones (Android refuses a lower one).
          echo "build=$(( ${{ github.run_number }} + BUILD_OFFSET ))" >> "$GITHUB_OUTPUT"

      - name: Build Windows app
        shell: bash
        run: |
          flutter build windows --release \
            --build-number="${{ steps.app-version.outputs.build }}" \
            --dart-define=API_URL="${{ env.API_URL }}" \
            --dart-define=REVERB_HOST="${{ env.REVERB_HOST }}" \
            --dart-define=REVERB_PORT="${{ env.REVERB_PORT }}" \
            --dart-define=REVERB_SCHEME="${{ env.REVERB_SCHEME }}" \
            --dart-define=REVERB_APP_KEY="${{ env.REVERB_APP_KEY }}" \
            --dart-define=PUBLISHER_NAME="${{ env.PUBLISHER_NAME }}" \
            --dart-define=SUPPORT_EMAIL="${{ env.SUPPORT_EMAIL }}"

      - name: Package the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $build = "${{ steps.app-version.outputs.build }}"
          $source = Join-Path $env:GITHUB_WORKSPACE "build\windows\x64\runner\Release"
          $output = Join-Path $env:GITHUB_WORKSPACE "release"
          & $iscc "/DAppVersion=${{ steps.app-version.outputs.version }}" "/DBuildNumber=$build" "/DSourceDir=$source" "/DOutputDir=$output" "windows\installer\vixeo.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Join-Path $output "vixeo-setup-$build.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  vixeo-setup-$build.exe" | Out-File -Encoding ascii -NoNewline "$file.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ steps.app-version.outputs.build }}
          name: Vixeo Windows v${{ steps.app-version.outputs.version }} - build ${{ steps.app-version.outputs.build }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/vixeo-setup-${{ steps.app-version.outputs.build }}.exe
            release/vixeo-setup-${{ steps.app-version.outputs.build }}.exe.sha256
