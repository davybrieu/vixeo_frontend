name: Build Web

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  API_URL: https://api.vixeo.app
  PUBLISHER_NAME: Vixeo
  SUPPORT_EMAIL: support@vixeo.app

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=API_URL="${{ env.API_URL }}" \
            --dart-define=PUBLISHER_NAME="${{ env.PUBLISHER_NAME }}" \
            --dart-define=SUPPORT_EMAIL="${{ env.SUPPORT_EMAIL }}"

      - name: Upload web dist
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: build/web
          retention-days: 14

      - name: Commit build output to repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/web
          if git diff --cached --quiet; then
            echo "No changes in build/web to commit."
          else
            git commit -m "chore: update Flutter web build"
            git push origin HEAD:main
          fi

  deploy:
    name: Deploy to Laravel Forge
    needs: build-web
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && success()
    steps:
      - name: Trigger Forge deployment
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.FORGE_DEPLOY_WEBHOOK }}"

  build-apk-release:
    name: Build Android APK and publish GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Android release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VIXEO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret VIXEO_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vixeo-release.jks"
          test -s "$RUNNER_TEMP/vixeo-release.jks"

      - name: Build signed APK
        env:
          VIXEO_KEYSTORE_PATH: ${{ runner.temp }}/vixeo-release.jks
          VIXEO_KEYSTORE_PASSWORD: ${{ secrets.VIXEO_KEYSTORE_PASSWORD }}
          VIXEO_KEY_ALIAS: ${{ secrets.VIXEO_KEY_ALIAS }}
          VIXEO_KEY_PASSWORD: ${{ secrets.VIXEO_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_URL="${{ env.API_URL }}" \
            --dart-define=PUBLISHER_NAME="${{ env.PUBLISHER_NAME }}" \
            --dart-define=SUPPORT_EMAIL="${{ env.SUPPORT_EMAIL }}"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/vixeo-${{ github.run_number }}.apk"
          sha256sum "release/vixeo-${{ github.run_number }}.apk" > "release/vixeo-${{ github.run_number }}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Vixeo Android v${{ steps.app-version.outputs.version }} - build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/vixeo-${{ github.run_number }}.apk
            release/vixeo-${{ github.run_number }}.apk.sha256
