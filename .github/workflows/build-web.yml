name: Build Web

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  API_URL: https://api.vixeo.app
  PUBLISHER_NAME: Vixeo
  SUPPORT_EMAIL: support@vixeo.app

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: >-
          flutter build web --release
          --dart-define=API_URL=${{ env.API_URL }}
          --dart-define=PUBLISHER_NAME="${{ env.PUBLISHER_NAME }}"
          --dart-define=SUPPORT_EMAIL=${{ env.SUPPORT_EMAIL }}

      - name: Upload web dist
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: build/web
          retention-days: 14

      - name: Commit build output to repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/web
          if git diff --cached --quiet; then
            echo "No changes in build/web to commit."
          else
            git commit -m "chore: update Flutter web build"
            git push origin HEAD:main
          fi
